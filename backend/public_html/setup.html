<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/LogoOB.PNG">
<title>NovaFlow CRM · Ersteinrichtung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100svh; padding: 24px 16px; }
  .setup-box { width:440px; max-width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px; box-shadow: var(--shadow-lg); }
  .setup-logo { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
  .setup-logo img { max-height:40px; width:auto; display:block; }
  .setup-logo span { font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--text3); }
  .setup-eyebrow { font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--copper); margin-bottom:6px; }
  .setup-title { font-size:22px; font-weight:600; letter-spacing:-0.025em; margin-bottom:6px; }
  .setup-sub { font-size:13px; color:var(--text2); margin-bottom:24px; line-height:1.6; }
  .setup-btn { width:100%; height:44px; font-size:14px; }
  .msg { font-size:12px; margin-top:4px; margin-bottom:8px; text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="setup-box">
  <div class="setup-logo">
    <img src="/LogoKomplett-klein.PNG" alt="NovaFlow">
    <span>CRM</span>
  </div>
  <div class="setup-eyebrow">Erster Start</div>
  <div class="setup-title">Ersteinrichtung</div>
  <div class="setup-sub">Erstelle deinen Admin-Account für das NovaFlow CRM. Dieser Schritt ist nur einmalig möglich.</div>

  <div class="form-group"><label for="full_name">Vollständiger Name</label><input type="text" id="full_name" class="form-control" placeholder="Max Mustermann" autocomplete="name"></div>
  <div class="form-group"><label for="username">Benutzername</label><input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username"></div>
  <div class="form-group"><label for="email">E-Mail</label><input type="email" id="email" class="form-control" placeholder="info@novaflowservices.de" autocomplete="email"></div>
  <div class="form-group"><label for="password">Passwort</label><input type="password" id="password" class="form-control" placeholder="Mindestens 8 Zeichen" autocomplete="new-password"></div>

  <div class="msg" id="msg"></div>
  <button class="btn btn-primary setup-btn" onclick="doSetup()"><i class="fas fa-check"></i> Admin-Account erstellen</button>
</div>

<script src="/shared/api.js"></script>
<script>
async function doSetup() {
  const full_name = document.getElementById('full_name').value.trim();
  const username  = document.getElementById('username').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const msg       = document.getElementById('msg');

  if (!full_name || !username || !email || !password)
    return (msg.innerHTML = '<span style="color:var(--red)">Bitte alle Felder ausfüllen.</span>');
  if (password.length < 8)
    return (msg.innerHTML = '<span style="color:var(--red)">Passwort mindestens 8 Zeichen.</span>');

  try {
    await api('POST', '/auth/setup', { full_name, username, email, password });
    msg.innerHTML = '<span style="color:var(--green)">✓ Account erstellt — du wirst weitergeleitet...</span>';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } catch (e) {
    msg.innerHTML = `<span style="color:var(--red)">${escHtml(e.message)}</span>`;
  }
}
</script>
</body>
</html>
