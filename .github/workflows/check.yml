# Prüfung vor dem Live-Gang: jeder Pull Request und jeder Stand auf main wird
# getestet. Live geht der Stand wie bisher über Hostinger (holt main automatisch).
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch ersetzt eine noch laufende Prüfung
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Prüfen und testweise starten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: leadhunter
          MARIADB_USER: lh
          MARIADB_PASSWORD: lh
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Syntax prüfen
        run: |
          find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Datenbank-Schema laden
        run: mysql -h 127.0.0.1 -uroot -proot < db/schema.sql

      - name: Server starten und prüfen
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          PORT=3055
          NODE_ENV=production
          BASE_URL=http://localhost:3055
          JWT_SECRET=ci-nur-zum-testen-ci-nur-zum-testen
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=lh
          DB_PASSWORD=lh
          DB_NAME=leadhunter
          EOF
          node server.js > server.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://localhost:3055/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3055/api/health
          curl -fsS -o /dev/null http://localhost:3055/login
          curl -fsS -o /dev/null http://localhost:3055/shared/api.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3055/api/leads)" = 401

      - name: Server-Log bei Fehler
        if: failure()
        run: cat backend/server.log || true
