# Automatische Auslieferung: jeder Stand auf main wird geprüft und dann auf den
# Server gespielt. Einrichtung (Secrets) siehe README → „Automatische Auslieferung“.
name: Auslieferung

on:
  push:
    branches: [main]
  pull_request:          # bei Pull Requests nur prüfen, nicht ausliefern
  workflow_dispatch:

# Nie zwei Auslieferungen gleichzeitig; eine laufende wird nicht abgebrochen
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Prüfen und testweise starten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: leadhunter
          MARIADB_USER: lh
          MARIADB_PASSWORD: lh
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Syntax prüfen
        run: |
          find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
          bash -n deploy/remote-deploy.sh

      - name: Datenbank-Schema laden
        run: mysql -h 127.0.0.1 -uroot -proot < db/schema.sql

      - name: Server starten und prüfen
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          PORT=3055
          NODE_ENV=production
          BASE_URL=http://localhost:3055
          JWT_SECRET=ci-nur-zum-testen-ci-nur-zum-testen
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=lh
          DB_PASSWORD=lh
          DB_NAME=leadhunter
          EOF
          node server.js > server.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://localhost:3055/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3055/api/health
          curl -fsS -o /dev/null http://localhost:3055/login
          curl -fsS -o /dev/null http://localhost:3055/shared/api.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3055/api/leads)" = 401

      - name: Server-Log bei Fehler
        if: failure()
        run: cat backend/server.log || true

  deploy:
    name: Auf den Server spielen
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PM2_NAME: ${{ vars.DEPLOY_PM2_NAME }}
    steps:
      - name: Einrichtung prüfen
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::warning::Automatische Auslieferung ist noch nicht eingerichtet (Secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY fehlen). Siehe README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - name: SSH vorbereiten
        if: steps.cfg.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS ist nicht gesetzt – Server-Schlüssel wird ungeprüft übernommen. Empfohlen: Secret setzen (siehe README)."
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Archiv erstellen und hochladen
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git archive --format=tar.gz -o release.tgz HEAD
          scp -q -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:.crm-release.tgz"

      - name: Auf dem Server ausliefern
        if: steps.cfg.outputs.ready == 'true'
        run: |
          remote_env="$(printf 'APP_DIR=%q SHA=%q PM2_NAME=%q ARCHIVE=.crm-release.tgz' \
            "$DEPLOY_PATH" "$GITHUB_SHA" "${DEPLOY_PM2_NAME:-leadhunter}")"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_env bash -s" < deploy/remote-deploy.sh
